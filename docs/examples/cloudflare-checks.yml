name: Workers migration checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - run: pnpm cf:check && pnpm lint && pnpm exec tsc --noEmit
      - run: pnpm cache:test && pnpm personality:test && pnpm cf:test
      - run: pnpm cf:build
      - run: pnpm exec wrangler deploy --dry-run
      - name: Exercise the actual local Worker (no production secrets)
        run: |
          pnpm exec vite preview --host localhost --port 4173 > /tmp/arena-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/arena-worker.log' EXIT
          for attempt in $(seq 1 60); do
            curl --silent --fail http://localhost:4173/ > /dev/null && break
            sleep 2
          done
          pnpm cf:smoke
