# =============================================================================
# LLM personality profile study — OEJTS 1.2
#
# Model catalogue snapshot: 2026-09-11, ZenMux public model and protocol lists.
# Selection: original manufacturer baseline + nine requested comparison models.
# All active models must support Responses on a manufacturer-operated route.
# 27 models x 16 independent administrations = 432 valid questionnaires.
# Mistral Large 3 is deferred below because its catalogue lacks Responses.
#
# Every id is pinned to the manufacturer-operated provider with the
# `model_slug:provider_slug` syntax. Refresh and review this list immediately
# before starting a new study run; a run pins this file into its result folder.
# =============================================================================

study:
  id: llm-mbti-oejts
  title: "LLM Personality Profiles with OEJTS 1.2"
  description: "Sixteen independent OEJTS 1.2 administrations per model, through manufacturer-operated providers."

catalog:
  asOf: "2026-09-11"
  source: "https://zenmux.ai/api/frontend/model/listByFilter?context_length=&sort=newest&keyword=&supported_protocol=responses"
  selectionRule: "Original latest-per-manufacturer baseline plus nine requested comparison models; Responses and manufacturer-operated routes required."

api:
  protocol: responses
  baseURL: "https://zenmux.ai/api/v1"
  apiKeyEnv: "ZENMUX_API_KEY"
  # Responses max_output_tokens includes visible output AND reasoning tokens.
  maxTokens: 8192
  # null omits temperature for ALL models (GPT-6 Astra does not support it).
  # Sampling defaults vary by provider; no per-model fallback is applied.
  temperature: null
  modelConcurrency: 8
  batchSize: 4
  maxRetries: 6
  retryBaseMs: 1000
  retryCapMs: 60000

instrument:
  id: oejts-1.2
  path: "research/instruments/oejts-1.2.json"
  language: en
  responseScale: 5
  promptVersion: oejts-original-en-v1

repeats: 16

# A model gets a stable type only when BOTH rules pass:
# 1. one unique full type occurs in a strict majority: at least 9/16;
# 2. each of that type's four letters occurs at least 13/16 times.
# Otherwise aggregate reports `no_stable_type`, while retaining the modal type.
classification:
  minModalCount: 9
  minLetterCount: 13

