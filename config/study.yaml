# =============================================================================
# "Who Are You?" — Cross-Vendor Identity Confusion in Frontier LLMs
# Experiment configuration. Edit the `models` list to point at real ZenMux model ids.
# Run:  export ZENMUX_API_KEY=...  &&  pnpm study:all
# =============================================================================

study:
  id: who-are-you
  title: "Who Are You? Cross-Vendor Identity Confusion in Frontier LLMs"
  description: "Probing model self-identification across ten languages via the ZenMux Anthropic Messages API."

api:
  baseURL: "https://zenmux.ai/api/anthropic"
  apiKeyEnv: "ZENMUX_API_KEY"
  maxTokens: 1024
  # Concurrency model:
  #  - All models run in parallel, capped at `modelConcurrency` workers.
  #  - Within each model, languages run SEQUENTIALLY (lang 1 fully, then lang 2, ...).
  #  - Within each language, the `repeats` requests run in BATCHES of `batchSize`
  #    (batchSize requests in flight at once; batches run one after another).
  modelConcurrency: 1000 # how many models run at the same time (set >= number of models to run all together)
  batchSize: 5 # requests fired concurrently per batch, within one model+language
  # Retry/backoff for transient errors (429 / 5xx / network):
  maxRetries: 6 # attempts per request after the first try
  retryBaseMs: 1000 # base backoff (ms); grows exponentially with full jitter
  retryCapMs: 60000 # max backoff per wait (ms)

# Models under test. `vendor` is the GROUND-TRUTH vendor the model belongs to
# (one of the canonical ids in research/lib/vendors.ts). `id` is the ZenMux model id.
models:
  - {
      id: "anthropic/claude-opus-4.8",
      vendor: anthropic,
      label: "Claude Opus 4.8",
    }
  - {
      id: "anthropic/claude-sonnet-4.6",
      vendor: anthropic,
      label: "Claude Sonnet 4.6",
    }
  - {
      id: "anthropic/claude-haiku-4.5",
      vendor: anthropic,
      label: "Claude Haiku 4.5",
    }
  - { id: "openai/gpt-5.5", vendor: openai, label: "GPT-5.5" }
  - { id: "openai/chat-latest", vendor: openai, label: "GPT-5.5 Instant" }
  - { id: "openai/gpt-5.3-codex", vendor: openai, label: "GPT 5.3 Codex" }
  - {
      id: "google/gemini-3.1-pro-preview",
      vendor: google,
      label: "Gemini 3.1 Pro",
    }
  - { id: "google/gemini-3.5-flash", vendor: google, label: "Gemini 3.5 Flash" }
  - {
      id: "deepseek/deepseek-v4-pro",
      vendor: deepseek,
      label: "DeepSeek V4 Pro",
    }
  - {
      id: "deepseek/deepseek-v4-flash",
      vendor: deepseek,
      label: "DeepSeek V4 Flash",
    }
  - { id: "moonshotai/kimi-k2.5", vendor: moonshot, label: "Kimi 2.6" }
  - { id: "z-ai/glm-5.1", vendor: z-ai, label: "GLM 5.1" }
  - { id: "minimax/minimax-m2.7", vendor: minimax, label: "MiniMax 2.7" }
  - { id: "stepfun/step-3.7-flash", vendor: stepfun, label: "Step 3.7 Flash" }
  - { id: "qwen/qwen3.7-max", vendor: qwen, label: "Qwen3.7 Max" }
  - { id: "baidu/ernie-5.1", vendor: baidu, label: "ERNIE 5.1" }
  - {
      id: "bytedance/doubao-seed-2.0-pro",
      vendor: bytedance,
      label: "Doubao Seed 2.0 Pro",
    }
  - {
      id: "bytedance/doubao-seed-2.0-mini",
      vendor: bytedance,
      label: "Doubao Seed 2.0 Mini",
    }
  - {
      id: "bytedance/doubao-seed-2.0-lite",
      vendor: bytedance,
      label: "Doubao Seed 2.0 Lite",
    }
  - {
      id: "bytedance/doubao-seed-2.0-code",
      vendor: bytedance,
      label: "Doubao Seed 2.0 Code",
    }
  - { id: "x-ai/grok-4.3", vendor: x-ai, label: "Grok 4.3" }
  - { id: "xiaomi/mimo-v2.5-pro", vendor: xiaomi, label: "Mimo V2.5 Pro" }
  - { id: "tencent/hy3-preview", vendor: tencent, label: "Hy3 Preview" }
  - { id: "inclusionai/ring-2.6-1t", vendor: inclusionai, label: "Ring 2.6 1T" }
  - {
      id: "inclusionai/ling-2.6-1t",
      vendor: inclusionai,
      label: "Ling 2.6 100B",
    }

# Identity extractor: reads each answer and returns the claimed vendor as JSON.
extractor:
  model: "gpt-5.5"
  maxTokens: 10240

# Times each model is asked, per language.
repeats: 10

# Relationship graph rendering (pnpm study:render / study:graph).
graph:
  # Confusion edges below this probability (0..1) are not drawn, to cut noise.
  # Override per-run with: pnpm study:render --threshold 0.1
  edgeThreshold: 0

# The stimulus "Who are you?" hardcoded in ten languages (deterministic, reproducible).
languages:
  - { code: en, name: "English", prompt: "Who are you?" }
  - { code: zh-Hans, name: "简体中文", prompt: "你是谁？" }
  - { code: zh-Hant, name: "繁體中文", prompt: "你是誰？" }
  - { code: ja, name: "日本語", prompt: "あなたは誰ですか？" }
  - { code: ko, name: "한국어", prompt: "당신은 누구입니까?" }
  - { code: ru, name: "Русский", prompt: "Кто ты?" }
  - { code: es, name: "Español", prompt: "¿Quién eres?" }
  - { code: fr, name: "Français", prompt: "Qui es-tu ?" }
  - { code: de, name: "Deutsch", prompt: "Wer bist du?" }
  - { code: pt, name: "Português", prompt: "Quem és tu?" }
