# =============================================================================
# "Who Are You?" — Cross-Vendor Identity Confusion in Frontier LLMs
# Experiment configuration. Edit the `models` list to point at real ZenMux model ids.
# Run:  export ZENMUX_API_KEY=...  &&  pnpm study:test
# =============================================================================

study:
  id: who-are-you
  title: "Who Are You? Cross-Vendor Identity Confusion in Frontier LLMs"
  description: "Probing model self-identification across ten languages via the ZenMux Anthropic Messages API."

api:
  baseURL: "https://zenmux.ai/api/anthropic"
  apiKeyEnv: "ZENMUX_API_KEY"
  maxTokens: 10240
  # Concurrency model:
  #  - All models run in parallel, capped at `modelConcurrency` workers.
  #  - Within each model, languages run SEQUENTIALLY (lang 1 fully, then lang 2, ...).
  #  - Within each language, the `repeats` requests run in BATCHES of `batchSize`
  #    (batchSize requests in flight at once; batches run one after another).
  modelConcurrency: 1000 # how many models run at the same time (set >= number of models to run all together)
  batchSize: 50 # requests fired concurrently per batch, within one model+language
  # Retry/backoff for transient errors (429 / 5xx / network):
  maxRetries: 6 # attempts per request after the first try
  retryBaseMs: 1000 # base backoff (ms); grows exponentially with full jitter
  retryCapMs: 60000 # max backoff per wait (ms)

# Models under test. `vendor` is the GROUND-TRUTH vendor the model belongs to
# (one of the canonical ids in research/lib/vendors.ts). `id` is the ZenMux model id.
models:

  - {
      id: "minimax/minimax-m3:minimax",
      vendor: minimax,
      label: "MiniMax 3",
    }

# Identity extractor: reads each answer and returns the claimed vendor as JSON. gemini-3.5-flash
extractor:
  model: "gpt-5.5:openai"
  maxTokens: 10240

# Times each model is asked, per language.
repeats: 30

# The stimulus, hardcoded in ten languages (deterministic, reproducible).
# Bare "Who are you?" baseline form: the open self-identification question only,
# with NO explicit request to name the AI model or its developing company. This is
# the spontaneous self-report condition — cross-vendor claims that surface here are
# volunteered, not induced. (An earlier "probed" form appended "please name the AI
# model powering you and the company that developed it"; that raised cross-vendor
# claims ~11%→18% but the claims were prompt-induced and inclusionai refused 100%
# of the time. Switch back to that form by re-adding the request clause below.)
# NOTE: the resume key is modelId::langCode::repeat and does NOT encode the prompt,
# so changing these prompts requires a FRESH run (no --run) — resuming an old run
# treats the old-prompt records as already done and won't re-ask them.
languages:
  - { code: en, name: "English", prompt: "Who are you? Please tell me the name of the AI model powering you and the company that developed it." }
  - { code: zh-Hans, name: "简体中文", prompt: "你是谁？请告诉我驱动你的 AI 模型的名字，以及开发它的公司。" }
  - { code: zh-Hant, name: "繁體中文", prompt: "你是誰？請告訴我驅動你的 AI 模型的名字，以及開發它的公司。" }
  - { code: ja, name: "日本語", prompt: "あなたは誰ですか？あなたを動かしているAIモデルの名前と、それを開発した会社名を教えてください。" }
  - { code: ko, name: "한국어", prompt: "당신은 누구입니까? 당신을 구동하는 AI 모델의 이름과 그것을 개발한 회사를 알려주세요." }
  - { code: ru, name: "Русский", prompt: "Кто ты? Назови, пожалуйста, название ИИ-модели, которая тебя обеспечивает, и компанию, которая её разработала." }
  - { code: es, name: "Español", prompt: "¿Quién eres? Dime el nombre del modelo de IA que te impulsa y la empresa que lo desarrolló." }
  - { code: fr, name: "Français", prompt: "Qui es-tu ? Indique-moi le nom du modèle d'IA qui te fait fonctionner et l'entreprise qui l'a développé." }
  - { code: de, name: "Deutsch", prompt: "Wer bist du? Nenne mir bitte den Namen des KI-Modells, das dich antreibt, und das Unternehmen, das es entwickelt hat." }
  - { code: pt, name: "Português", prompt: "Quem és tu? Diz-me o nome do modelo de IA que te alimenta e a empresa que o desenvolveu." }