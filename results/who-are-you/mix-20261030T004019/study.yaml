study:
  id: who-are-you
  title: Who Are You? Cross-Vendor Identity Confusion in Frontier LLMs
  description: Probing model self-identification across ten languages via the
    ZenMux Anthropic Messages API.
api:
  baseURL: https://zenmux.ai/api/anthropic
  apiKeyEnv: ZENMUX_API_KEY
  maxTokens: 10240
  modelConcurrency: 21
  batchSize: 8
  maxRetries: 6
  retryBaseMs: 1000
  retryCapMs: 60000
