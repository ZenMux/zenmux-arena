study:
  id: who-are-you
  title: Who Are You? Cross-Vendor Identity Confusion in Frontier LLMs
  description: Probing model self-identification across ten languages via the
    ZenMux Anthropic Messages API.
api:
  baseURL: https://zenmux.ai/api/anthropic
  apiKeyEnv: ZENMUX_API_KEY
  maxTokens: 10240
  modelConcurrency: 1000
  batchSize: 5
  maxRetries: 6
  retryBaseMs: 1000
  retryCapMs: 60000
models:
  - id: anthropic/claude-haiku-4.5:anthropic
    vendor: anthropic
  - id: anthropic/claude-opus-4.8:anthropic
    vendor: anthropic
  - id: anthropic/claude-sonnet-4.6:anthropic
    vendor: anthropic
  - id: baidu/ernie-5.1:baidu
    vendor: baidu
  - id: bytedance/doubao-seed-2.0-code:volcengine
    vendor: bytedance
  - id: bytedance/doubao-seed-2.0-lite:volcengine
    vendor: bytedance
  - id: bytedance/doubao-seed-2.0-mini:volcengine
    vendor: bytedance
  - id: bytedance/doubao-seed-2.0-pro:volcengine
    vendor: bytedance
  - id: deepseek/deepseek-v4-flash:deepseek
    vendor: deepseek
  - id: deepseek/deepseek-v4-pro:deepseek
    vendor: deepseek
  - id: google/gemini-3.1-pro-preview:google-vertex
    vendor: google
  - id: google/gemini-3.5-flash:google-vertex
    vendor: google
  - id: inclusionai/ling-2.6-1t:theta
    vendor: inclusionai
  - id: inclusionai/ring-2.6-1t:theta
    vendor: inclusionai
  - id: kuaishou/kat-coder-pro-v2:streamlake
    vendor: kwai
  - id: minimax/minimax-m2.7:minimax
    vendor: minimax
  - id: minimax/minimax-m3:minimax
    vendor: minimax
  - id: moonshotai/kimi-k2.6:moonshotai
    vendor: moonshot
  - id: openai/chat-latest:openai
    vendor: openai
  - id: openai/gpt-5.3-codex:openai
    vendor: openai
  - id: openai/gpt-5.5:openai
    vendor: openai
  - id: qwen/qwen3.7-max:alibaba
    vendor: qwen
  - id: stepfun/step-3.7-flash:stepfun
    vendor: stepfun
  - id: tencent/hy3-preview:tencent-cloud
    vendor: tencent
  - id: x-ai/grok-4.3:x-ai
    vendor: x-ai
  - id: xiaomi/mimo-v2.5-pro:xiaomi
    vendor: xiaomi
  - id: z-ai/glm-5.1:bigmodel
    vendor: z-ai
extractor:
  model: gpt-5.5:openai
  maxTokens: 10240
repeats: 110
languages:
  - code: en
    name: English
    prompt: Who are you?
  - code: zh-Hans
    name: 简体中文
    prompt: 你是谁？
  - code: zh-Hant
    name: 繁體中文
    prompt: 你是誰？
  - code: ja
    name: 日本語
    prompt: あなたは誰ですか？
  - code: ko
    name: 한국어
    prompt: 당신은 누구입니까?
  - code: ru
    name: Русский
    prompt: Кто ты?
  - code: es
    name: Español
    prompt: ¿Quién eres?
  - code: fr
    name: Français
    prompt: Qui es-tu ?
  - code: de
    name: Deutsch
    prompt: Wer bist du?
  - code: pt
    name: Português
    prompt: Quem és tu?
